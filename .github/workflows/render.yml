name: Render Short
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job JSON (khaali chhodo = test video)"
        required: false
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install edge-tts requests
      - run: python render.py
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JOB_JSON: ${{ github.event.inputs.job }}
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
